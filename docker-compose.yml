# Docker Compose สำหรับ VPSMCU (ระบบสารสนเทศวิปัสสนากรรมฐาน มจร)
# จำลองสภาพแวดล้อมจริง: Apache 2.4 + PHP 8.4 + MariaDB/MySQL
# จัดสรร Port ไม่ให้ซ้ำกับระบบอื่นใน Docker:
# - Web Server: 8086
# - MySQL Database: 3310
# - phpMyAdmin GUI: 8088

services:
  # Database Server (MariaDB / MySQL 8.0 Compatible)
  vpsmcu-db:
    container_name: VPSMCU-DB
    image: docker.io/library/mariadb:10.6
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_mcuvms_pass}
      MYSQL_DATABASE: ${DB_NAME:-mcuvms_db}
      MYSQL_USER: ${DB_USER:-mcuvms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mcuvms_password}
    ports:
      - "3310:3306" # Port ภายนอก 3310
    volumes:
      - vpsmcu_db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    networks:
      - vpsmcu-network
    healthcheck:
      test: "mysqladmin ping -h localhost -u root -p${DB_ROOT_PASSWORD:-root_mcuvms_pass}"
      interval: 5s
      timeout: 5s
      retries: 5

  # Apache 2.4 + PHP 8.4 Web Server
  vpsmcu-web:
    container_name: VPSMCU
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      vpsmcu-db:
        condition: service_healthy
    environment:
      APP_ENV: development
      APP_URL: http://localhost:8086
      DB_CONNECTION: mysql
      DB_HOST: vpsmcu-db
      DB_PORT: 3306
      DB_DATABASE: ${DB_NAME:-vpsmcu_db}
      DB_USERNAME: ${DB_USER:-vpsmcu_user}
      DB_PASSWORD: ${DB_PASSWORD:-vpsmcu_password}
      DB_NAME: ${DB_NAME:-vpsmcu_db}
      DB_USER: ${DB_USER:-vpsmcu_user}
      DB_PASS: ${DB_PASSWORD:-vpsmcu_password}
    ports:
      - "8086:80" # Port ภายนอก 8086 สำหรับเว็บไซต์ VPSMCU
    volumes:
      - ./vpsmcu-laravel:/var/www/html:z
    networks:
      - vpsmcu-network

  # Database Web GUI (phpMyAdmin)
  vpsmcu-pma:
    container_name: VPSMCU-GUI
    image: docker.io/library/phpmyadmin:latest
    restart: unless-stopped
    depends_on:
      - vpsmcu-db
    environment:
      PMA_HOST: vpsmcu-db
      PMA_PORT: 3306
      PMA_USER: ${DB_USER:-vpsmcu_user}
      PMA_PASSWORD: ${DB_PASSWORD:-vpsmcu_password}
      UPLOAD_LIMIT: 64M
    ports:
      - "8088:80" # Port ภายนอก 8088 สำหรับเปิด phpMyAdmin
    networks:
      - vpsmcu-network

volumes:
  vpsmcu_db_data:
    name: vpsmcu_mariadb_data

networks:
  vpsmcu-network:
    name: vpsmcu-network
    driver: bridge
